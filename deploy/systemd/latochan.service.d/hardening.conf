# Sandbox for the LatoChan gateway (added 2026-10-28). Undo: sudo rm /etc/systemd/system/latochan.service.d/hardening.conf && sudo systemctl daemon-reload && sudo systemctl restart latochan
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/latochan
ProtectHome=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

UMask=0007
CapabilityBoundingSet=
