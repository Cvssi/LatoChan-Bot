name: Review checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6
        with:
          python-version: '3.14'
      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install locked production dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Install review tools
        run: python -m pip install ruff==0.17.3 pip-audit==2.10.1
      - name: Static checks
        run: |
          python -m pip check
          ruff check --select E9,F .
          bash -n setup.sh
      - name: Regression checks
        run: |
          python -m unittest discover -s tests -v
          python tests/golden.py
      - name: Audit locked production dependencies
        run: pip-audit --no-deps --disable-pip -r requirements.lock
